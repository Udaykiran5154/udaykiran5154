<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UK Petrol Bunk - Petrol Sales Tracker">
    <title>UK Petrol Bunk - Sales Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>UK Petrol Bunk</h1>
            <p>Track Petrol Sales</p>
        </div>
    </header>

    <!-- Sales Form Section -->
    <section id="form-section">
        <h2>Enter Petrol Sales Details</h2>
        <form id="sales-form">
            <label for="day">Day:</label>
            <input type="text" id="day" name="day" required>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="amount">Amount of Petrol Sold (in liters):</label>
            <input type="number" id="amount" name="amount" required>

            <label for="candidate">Candidate Name:</label>
            <input type="text" id="candidate" name="candidate" required>

            <button type="submit">Submit</button>
        </form>
    </section>

    <!-- Sales Information Section -->
    <section id="sales-info">
        <h2>Sales Information</h2>
        <table id="sales-table">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Date</th>
                    <th>Amount of Petrol Sold (L)</th>
                    <th>Candidate Name</th>
                </tr>
            </thead>
            <tbody>
                <!-- Sales data will be added here -->
            </tbody>
        </table>
    </section>

    <footer>
        <p>&copy; 2025 UK Petrol Bunk. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
